<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Task</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <div class="brand">
          <div class="logo">TF</div>
          <div class="brand-text">
            <h1>TaskFlow</h1>
            <p>Create tasks with speed and style.</p>
          </div>
        </div>

        <nav class="site-nav">
          <a href="index.html">Home</a>
          <a href="task-list.html">Task List</a>
          <a href="task-detail.html">Task Detail</a>
          <a href="about.html">About</a>
        </nav>
      </header>

      <main class="page-content">
        <h1 class="section-title">Add New Task</h1>

        <form class="card">
          <label for="task-title">Task Title</label>
          <input
            id="task-title"
            type="text"
            placeholder="Enter a short task name"
          />

          <label for="task-desc">Description</label>
          <textarea
            id="task-desc"
            rows="4"
            placeholder="Describe the task details"
          ></textarea>

          <label for="task-date">Due Date</label>
          <input id="task-date" type="date" />

          <label for="task-priority">Priority</label>
          <select id="task-priority">
            <option>High</option>
            <option>Medium</option>
            <option>Low</option>
          </select>

          <button
            type="submit"
            class="button button-primary"
            style="margin-top: 16px"
          >
            Add Task
          </button>
        </form>
      </main>

      <footer class="site-footer">
        TaskFlow © 2026 • Add tasks quickly and keep moving forward.
      </footer>
    </div>
  </body>
</html>
